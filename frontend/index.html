<!DOCTYPE html>
<html lang="zh-TW" class="dark neutral">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OmniKeep</title>
    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OmniKeep" />
    <meta name="format-detection" content="telephone=no" />
    <style>
      html, body { margin: 0; height: 100%; background: #f4f5f7; color: #202124; }
      html.dark, html.dark body { background: #0f0f0f; color: #f1f1f1; }
      html.oled, html.oled body { background: #000000; color: #ffffff; }
      .ok-boot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; height: 100dvh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; opacity: .78; }
      .ok-boot-ring { width: 28px; height: 28px; border-radius: 999px; border: 2px solid currentColor; border-top-color: transparent; opacity: .6; animation: ok-spin .75s linear infinite; }
      @keyframes ok-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Mirrors startingTheme()
      // and themeClasses() in src/lib/themeMode.ts: neutral dark is the default, and a theme
      // picked under the older key ("oled", "light", "system") is carried over.
      try {
        var modes = ['neutral', 'dark', 'oled', 'light', 'system'];
        var t = localStorage.getItem('omnikeep-theme-v2');
        var old = localStorage.getItem('omnikeep-theme');
        if (modes.indexOf(t) < 0) t = old === 'oled' || old === 'light' || old === 'system' ? old : 'neutral';
        var dark = t !== 'light' && (t !== 'system' || matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.classList.toggle('oled', t === 'oled');
        root.classList.toggle('neutral', t === 'neutral');
        root.setAttribute('data-accent', localStorage.getItem('omnikeep-accent') || 'blue');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app">
      <div class="ok-boot" aria-label="載入 OmniKeep">
        <div class="ok-boot-ring"></div>
        <span>載入 OmniKeep…</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
