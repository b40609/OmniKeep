# Managed by prek (`prek install` / `prek run --all-files`).
# Fast deterministic gates preventing secrets, Python bugs, and iOS/WebKit UI regressions.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Gitleaks staged secret scan
        entry: gitleaks git --pre-commit --staged --no-banner
        language: system
        pass_filenames: false

      - id: ruff-critical
        name: Ruff critical Python & async bug check
        entry: ruff check
        language: system
        types: [python]

      - id: frontend-mobile-guardrails
        name: Frontend oxlint + stylelint + mobile/PWA contract guardrails
        # npm runs the script with cmd.exe on Windows and sh elsewhere: `&&` stops at the first
        # failure in both. The old `pwsh -Command "...; npm run lint; node --test ..."` took only
        # the last command's exit code, so a lint error passed (2026-11-26 review, KEEP-X-01).
        entry: npm --prefix frontend run precommit
        language: system
        files: ^frontend/(src/|index\.html|vite\.config\.ts)
        pass_filenames: false
