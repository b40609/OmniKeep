# Managed by prek (`prek install` / `prek run --all-files`).
# Fast deterministic gates preventing secrets, Python bugs, and iOS/WebKit UI regressions.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Gitleaks staged secret scan
        entry: gitleaks git --pre-commit --staged --no-banner
        language: system
        pass_filenames: false

      - id: ruff-critical
        name: Ruff critical Python & async bug check
        entry: ruff check
        language: system
        types: [python]

      - id: frontend-mobile-guardrails
        name: Frontend oxlint + stylelint + mobile/PWA contract guardrails
        entry: pwsh -NoProfile -Command "Set-Location frontend; npm run lint; node --test tests/mobile-guardrails.test.mjs tests/pwa-contract.test.mjs"
        language: system
        files: ^frontend/(src/|index\.html|vite\.config\.ts)
        pass_filenames: false
