name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    # Pinned rather than ubuntu-latest, which will move to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.12: the Docker image and the minimum (items.py needs PEP 701 f-strings).
        # 3.14: what the Windows host's watchdog falls back to.
        python: ["3.12", "3.14"]
    steps:
      # Actions are pinned to full commit SHAs (GitHub's hardening guidance); the comment is the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Built before pytest so the tests that check the served build (icons, version, service worker) run too.
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ffmpeg (the reel tests skip without it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check that sqlite-vec loads (its tests fail in CI otherwise)
        run: |
          python -c "import sqlite3, sqlite_vec; c = sqlite3.connect(':memory:'); c.enable_load_extension(True); sqlite_vec.load(c); print('sqlite-vec', c.execute('select vec_version()').fetchone()[0])"

      - name: Backend tests
        run: python -m pytest -rs

      # After the tests, so they keep exercising the "not installed" path.
      - name: Optional speech-to-text requirements install and import
        run: |
          python -m pip install -r requirements-stt.txt
          python -c "import faster_whisper, ctranslate2, opencc; print('faster-whisper', faster_whisper.__version__, 'ctranslate2', ctranslate2.__version__)"

      - name: Optional frame OCR requirements install and import
        run: |
          python -m pip install -r requirements-ocr.txt
          python -c "import scenedetect, cv2, imagehash, rapidocr, onnxruntime; from app.parsers import screen; assert screen.available(); print('scenedetect', scenedetect.__version__, 'opencv', cv2.__version__)"

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --pull -t omnikeep-ci .

      - name: Start it and check /health reports the VERSION file
        run: |
          docker run -d --name omnikeep -p 5000:5000 -e API_KEY="ci-only-$(openssl rand -hex 24)" omnikeep-ci
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:5000/health); then
              echo "$body"
              echo "$body" | grep -F "\"version\":\"$(cat VERSION)\""
              exit 0
            fi
            sleep 2
          done
          docker logs omnikeep
          exit 1

      - name: The default image leaves out playwright and speech-to-text
        run: |
          docker run --rm omnikeep-ci python -c "import importlib.util as u; extra = [m for m in ('playwright', 'faster_whisper') if u.find_spec(m)]; assert not extra, extra"

      - name: LOCAL_STT=true adds speech-to-text
        run: |
          docker build --build-arg LOCAL_STT=true -t omnikeep-ci-stt .
          docker run --rm omnikeep-ci-stt python -c "import faster_whisper, ctranslate2; print('faster-whisper', faster_whisper.__version__)"
